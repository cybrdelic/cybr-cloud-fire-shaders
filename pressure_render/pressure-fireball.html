<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pressure fireball</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111a23;color:#eef2f4;font:14px system-ui,sans-serif}canvas{width:100%;height:100%;display:block}#bar{position:fixed;left:24px;right:24px;bottom:22px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#101921da;backdrop-filter:blur(14px);border:1px solid #ffffff24}button,select{font:inherit;color:inherit;background:#ffffff12;border:1px solid #ffffff30;border-radius:7px;padding:8px 14px;cursor:pointer}button:hover{background:#ffffff26}.name{letter-spacing:.16em;font-size:11px;margin-right:auto}#message{position:fixed;top:30%;left:10%;right:10%;font-size:18px;line-height:1.6;text-align:center;white-space:pre-wrap}#message:empty{display:none}label{font-size:12px;display:flex;gap:8px;align-items:center}@media(max-width:600px){#bar{left:10px;right:10px;gap:7px;padding:10px}.name{display:none}button,select{padding:8px}}
</style>
<canvas id="canvas"></canvas><div id="message"></div>
<div id="bar"><span class="name">PRESSURE / FIRE</span><button id="pause">Pause</button><button id="restart">Restart</button></div>
<script>
const sources={"common": "// Reactive compressible Euler. State is stored in a 2D atlas; no Pro buffer required.\n// Common tab. Simulation: 769x672 RGBA32F, nearest, 20 recursions.\n// Shading: 384x336 RGBA16F, linear, 1 recursion. Main: display resolution.\nconst ivec3 GRID=ivec3(48,56,48);\nconst ivec2 TILE=ivec2(384,336);\nconst vec3 BMIN=vec3(-6,-1,-6),BMAX=vec3(6,13,6);\nconst float GAMMA=1.3,DT=.0025;\nconst float HEAT=500.,RATE=3.5,COOL=8.,BUOY=.35,CONFINEMENT=2.;\nconst float SOOT_GAIN=1600.,EMISSION_GAIN=.6;\nstruct State{vec4 a;vec4 b;};\nState addS(State x,State y){return State(x.a+y.a,x.b+y.b);}\nState subS(State x,State y){return State(x.a-y.a,x.b-y.b);}\nState mulS(State x,float a){return State(x.a*a,x.b*a);}\nivec2 address(ivec3 p){p=clamp(p,ivec3(0),GRID-1);return ivec2((p.z%8)*GRID.x+p.x,(p.z/8)*GRID.y+p.y);}\nivec3 voxel(ivec2 p){return ivec3(p.x%GRID.x,p.y%GRID.y,(p.y/GRID.y)*8+p.x/GRID.x);}\nState readS(sampler2D tex,ivec3 p,int bank){\n ivec2 c=address(p)+ivec2(0,bank*TILE.y);\n return State(texelFetch(tex,c,0),texelFetch(tex,c+ivec2(TILE.x,0),0));\n}\nState primitive(State s){\n float rho=s.a.x;\n return State(vec4(rho,s.a.yzw/rho),vec4((GAMMA-1.)*(s.b.x-.5*dot(s.a.yzw,s.a.yzw)/rho),s.b.yzw/rho));\n}\nState conserved(State q){\n float rho=q.a.x;\n return State(vec4(rho,q.a.yzw*rho),vec4(q.b.x/(GAMMA-1.)+.5*rho*dot(q.a.yzw,q.a.yzw),q.b.yzw*rho));\n}\nState sourceStep(State s,float dt){\n float rho=s.a.x,ke=.5*dot(s.a.yzw,s.a.yzw)/rho;\n float T=(GAMMA-1.)*(s.b.x-ke)/rho;\n float activation=smoothstep(1.3,2.,T);\n float burn=min(max(s.b.y,0.),max(s.b.z,0.)/3.)*(1.-exp(-RATE*activation*dt));\n s.b.y-=burn;s.b.z-=3.*burn;s.b.w+=.22*burn;s.b.x+=HEAT*burn;\n s.b.x-=max(s.b.x-ke-rho/(GAMMA-1.),0.)*(1.-exp(-dt/COOL));\n float impulse=dt*BUOY*(1.-rho),old=s.a.z;\n s.a.z+=impulse;s.b.x+=.5*(old+s.a.z)*impulse/rho;\n return s;\n}\nvec4 minmod(vec4 a,vec4 b,vec4 c){return .25*(sign(a)+sign(b))*abs(sign(a)+sign(c))*min(abs(a),min(abs(b),abs(c)));}\nState slopeS(State a,State b,State c){\n return State(minmod(1.5*(b.a-a.a),.5*(c.a-a.a),1.5*(c.a-b.a)),\n              minmod(1.5*(b.b-a.b),.5*(c.b-a.b),1.5*(c.b-b.b)));\n}\nState riemann(State l,State r,int axis){\n State ul=conserved(l),ur=conserved(r);\n int n=axis+1;float vl=l.a[n],vr=r.a[n],pl=l.b.x,pr=r.b.x;\n float cl=sqrt(GAMMA*pl/l.a.x),cr=sqrt(GAMMA*pr/r.a.x);\n float sl=min(vl-cl,vr-cr),sr=max(vl+cl,vr+cr);\n State fl=mulS(ul,vl),fr=mulS(ur,vr);\n fl.a[n]+=pl;fr.a[n]+=pr;fl.b.x+=pl*vl;fr.b.x+=pr*vr;\n if(sl>=0.)return fl;if(sr<=0.)return fr;\n float al=l.a.x*(sl-vl),ar=r.a.x*(sr-vr);\n float sm=(pr-pl+al*vl-ar*vr)/(al-ar);\n State q=l,u=ul,f=fl;float sk=sl,vk=vl,pk=pl;\n if(sm<0.){q=r;u=ur;f=fr;sk=sr;vk=vr;pk=pr;}\n float rs=q.a.x*(sk-vk)/(sk-sm);\n State star=State(vec4(rs,rs*q.a.yzw),vec4(0,rs*q.b.yzw));\n star.a[n]=rs*sm;\n star.b.x=rs*(u.b.x/q.a.x+(sm-vk)*(sm+pk/(q.a.x*(sk-vk))));\n float ei=star.b.x-.5*dot(star.a.yzw,star.a.yzw)/rs;\n float ps=pk+q.a.x*(sk-vk)*(sm-vk);\n if(!(rs>1e-10&&ei>1e-10&&ps>1e-10))\n  return mulS(addS(subS(mulS(fl,sr),mulS(fr,sl)),mulS(subS(ur,ul),sl*sr)),1./(sr-sl));\n return addS(f,mulS(subS(star,u),sk));\n}\nState stageRead(sampler2D tex,ivec3 p,bool halfSource){\n State s=readS(tex,p,0);if(halfSource)s=sourceStep(s,DT*.5);return primitive(s);\n}\nvec3 stageVelocity(sampler2D tex,ivec3 p,bool halfSource){\n vec4 a=texelFetch(tex,address(p),0);\n if(halfSource)a.z+=DT*.5*BUOY*(1.-a.x);\n return a.yzw/a.x;\n}\nvec4 curlAt(sampler2D tex,ivec3 p,bool halfSource){\n vec3 h=(BMAX-BMIN)/vec3(GRID);\n vec3 dx=(stageVelocity(tex,p+ivec3(1,0,0),halfSource)-stageVelocity(tex,p-ivec3(1,0,0),halfSource))/(2.*h.x);\n vec3 dy=(stageVelocity(tex,p+ivec3(0,1,0),halfSource)-stageVelocity(tex,p-ivec3(0,1,0),halfSource))/(2.*h.y);\n vec3 dz=(stageVelocity(tex,p+ivec3(0,0,1),halfSource)-stageVelocity(tex,p-ivec3(0,0,1),halfSource))/(2.*h.z);\n vec3 w=vec3(dy.z-dz.y,dz.x-dx.z,dx.y-dy.x);return vec4(w,length(w));\n}\nState flowRHS(sampler2D tex,ivec3 p,State center,bool halfSource){\n State d=State(vec4(0),vec4(0));\n vec3 spacing=(BMAX-BMIN)/vec3(GRID);\n for(int axis=0;axis<3;axis++){\n  ivec3 e=ivec3(0);e[axis]=1;\n  State mm=stageRead(tex,p-e*2,halfSource),m=stageRead(tex,p-e,halfSource);\n  State a=stageRead(tex,p+e,halfSource),aa=stageRead(tex,p+e*2,halfSource);\n  State sm=slopeS(mm,m,center),sc=slopeS(m,center,a),sp=slopeS(center,a,aa);\n  State lo=riemann(addS(m,mulS(sm,.5)),subS(center,mulS(sc,.5)),axis);\n  State hi=riemann(addS(center,mulS(sc,.5)),subS(a,mulS(sp,.5)),axis);\n  d=addS(d,mulS(subS(lo,hi),1./spacing[axis]));\n }\n vec3 w=curlAt(tex,p,halfSource).xyz,gradient=vec3(0);\n for(int axis=0;axis<3;axis++){\n  ivec3 e=ivec3(0);e[axis]=1;\n  gradient[axis]=(curlAt(tex,p+e,halfSource).w-curlAt(tex,p-e,halfSource).w)/(2.*spacing[axis]);\n }\n float magnitude=length(gradient);\n if(magnitude>1e-12){\n  vec3 force=CONFINEMENT*min(spacing.x,min(spacing.y,spacing.z))*center.a.x*cross(gradient/magnitude,w);\n  d.a.yzw+=force;d.b.x+=dot(force,center.a.yzw);\n }\n return d;\n}\nfloat pocket(vec3 p,vec3 c,vec3 r,float h){vec3 d=(p-c)/r;return 1./(1.+exp(clamp(9.*(dot(d,d)-1.-.65*h),-80.,80.)));}\nState initialState(ivec3 cell){\n vec3 p=BMIN+(vec3(cell)+.5)*(BMAX-BMIN)/vec3(GRID);\n float x=p.x,y=p.y,z=p.z;\n float h=.23*sin(3.7*x+1.2*y)*cos(4.2*z-.7*y)+.13*sin(8.1*z+2.8*y)*cos(7.3*x-1.5*z)+.08*sin(11.1*y+3.3*x)*cos(9.1*z+1.1*x);\n float remaining=1.;\n remaining*=1.-pocket(p,vec3(0,.93,0),vec3(.87,.60,.72),h);\n remaining*=1.-pocket(p,vec3(-.77,1.10,.08),vec3(.62,.44,.48),h);\n remaining*=1.-pocket(p,vec3(.78,1.15,-.18),vec3(.58,.52,.43),h);\n remaining*=1.-pocket(p,vec3(.14,1.49,.39),vec3(.49,.60,.49),h);\n remaining*=1.-pocket(p,vec3(-.27,.60,-.63),vec3(.57,.40,.48),h);\n remaining*=1.-pocket(p,vec3(.48,.60,.49),vec3(.53,.39,.41),h);\n float mixture=clamp((1.-remaining)*(.84+.35*h),0.,1.),rho=1.+.40*mixture;\n float fuel=clamp(.34*mixture*(1.+.55*h),0.,.49);\n vec3 d=vec3((x-.08)/.32,(y-.72)/.28,(z+.12)/.25);\n vec3 e=vec3((x+.31)/.24,(y-.83)/.24,(z-.10)/.27);\n float pressure=1.+.75*mixture+18.*exp(-pow(dot(d,d),2.))+9.*exp(-pow(dot(e,e),2.));\n return State(vec4(rho,0,0,0),vec4(pressure/(GAMMA-1.),rho*fuel,rho*.23*(1.-fuel),rho*.0015*mixture));\n}\nvec3 blackbody(float T){\n vec3 wl=vec3(.650,.550,.450)*1e-6;\n vec3 b=1./(pow(wl,vec3(5))*(exp(clamp(.014387769/(max(T,300.)*wl),vec3(0),vec3(80)))-1.));\n float ref=1./(pow(650e-9,5.)*(exp(.014387769/(1800.*650e-9))-1.));\n return b/ref*EMISSION_GAIN*clamp((T-650.)/300.,0.,1.);\n}\n", "simulation": "// pass1: 769x672, RGBA32F, NEAREST, recursion20. Uses its own previous output.\n// The extra column persists the RK stage across interrupted recursion budgets.\nvoid main(){\n ivec2 pixel=ivec2(gl_FragCoord.xy);\n ivec2 clockPixel=ivec2(2*TILE.x,0);\n float stage=texelFetch(u_pass1,clockPixel,0).x;\n if(pixel.x==clockPixel.x){fragColor=vec4(u_frame==0?0.:stage+1.,0,0,1);return;}\n int channel=pixel.x/TILE.x,bank=pixel.y/TILE.y;\n ivec3 p=voxel(pixel%TILE);\n if(u_frame==0){State s=initialState(p);fragColor=channel==0?s.a:s.b;return;}\n bool first=(int(stage)%2)==0;\n State old=readS(u_pass1,p,0),s=old;\n if(bank==1){\n  if(first)s=sourceStep(old,DT*.5);\n  else s=readS(u_pass1,p,1);\n }else{\n  if(first)s=sourceStep(s,DT*.5);\n  s=addS(s,mulS(flowRHS(u_pass1,p,primitive(s),first),DT));\n  if(!first)s=sourceStep(mulS(addS(readS(u_pass1,p,1),s),.5),DT*.5);\n }\n fragColor=channel==0?s.a:s.b;\n}\n", "shading": "// pass2: 384x336, RGBA16F, LINEAR, recursion1. Lighting only, no flow changes.\nvoid main(){\n ivec3 cell=voxel(ivec2(gl_FragCoord.xy));\n State s=readS(u_pass1,cell,0),q=primitive(s);\n vec3 p=BMIN+(vec3(cell)+.5)*(BMAX-BMIN)/vec3(GRID);\n vec3 sun=normalize(vec3(-.5,.85,-.35));\n float tau=0.;\n for(int i=0;i<44;i++){\n  vec3 at=p+sun*(float(i)+.5)*.5;\n  if(any(lessThan(at,BMIN))||any(greaterThan(at,BMAX)))break;\n  ivec3 j=ivec3((at-BMIN)/(BMAX-BMIN)*vec3(GRID));\n  tau+=readS(u_pass1,j,0).b.w*SOOT_GAIN*.5;\n }\n vec3 emission=blackbody(300.*q.b.x/q.a.x);\n vec3 light=vec3(.006,.008,.011)+vec3(.080,.070,.055)*exp(-tau);\n fragColor=vec4(light+emission,max(s.b.w,0.)*SOOT_GAIN);\n}\n", "main": "// Main pass. Trilinear interpolation within the shaded 3D atlas.\nvec4 field(vec3 world){\n vec3 p=clamp((world-BMIN)/(BMAX-BMIN)*vec3(GRID)-.5,vec3(0),vec3(GRID-1));\n int z=int(floor(p.z)),zz=min(z+1,GRID.z-1);\n vec2 a=vec2((z%8)*GRID.x,(z/8)*GRID.y)+p.xy+.5;\n vec2 b=vec2((zz%8)*GRID.x,(zz/8)*GRID.y)+p.xy+.5;\n return mix(texture(u_pass2,a/vec2(TILE)),texture(u_pass2,b/vec2(TILE)),fract(p.z));\n}\nvec3 film(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}\nvoid main(){\n vec3 eye=vec3(5,4.2,-10.5),target=vec3(0,2.6,0);\n vec3 w=normalize(target-eye),u=normalize(cross(w,vec3(0,1,0))),v=cross(u,w);\n vec2 q=(gl_FragCoord.xy-.5*u_resolution)/u_resolution.y;\n vec3 rd=normalize(w*1.75+u*q.x+v*q.y);\n vec3 ia=(BMIN-eye)/rd,ib=(BMAX-eye)/rd;\n vec3 n=min(ia,ib),f=max(ia,ib);\n float a=max(max(n.x,n.y),n.z),b=min(min(f.x,f.y),f.z),trans=1.;\n vec3 sky=mix(vec3(.24,.29,.34),vec3(.12,.19,.27),smoothstep(-.2,.5,rd.y));\n sky+=vec3(.18,.16,.12)*pow(max(dot(rd,normalize(vec3(-.5,.85,-.35))),0.),12.);\n vec3 sum=vec3(0);\n if(b>max(a,0.)){\n  a=max(a,0.);int count=int(ceil((b-a)/.075));float ds=(b-a)/float(count);\n  for(int i=0;i<400;i++){\n   if(i>=count||trans<.001)break;\n   vec4 s=field(eye+rd*(a+(float(i)+.5)*ds));\n   float alpha=1.-exp(-s.a*ds);sum+=trans*alpha*s.rgb;trans*=1.-alpha;\n  }\n }\n fragColor=vec4(pow(film((sum+trans*sky)*.8),vec3(1./2.2)),1);\n}\n"};
const canvas=document.getElementById('canvas'),message=document.getElementById('message');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:false});
let failed=false;
function fail(e){failed=true;message.textContent=e.message||String(e);console.error(e);}
if(!gl)fail(new Error('This browser could not create WebGL2. Open this file in a browser with hardware graphics enabled.'));
if(gl&&!gl.getExtension('EXT_color_buffer_float'))fail(new Error('Floating-point render targets are required for this simulation.'));
if(!failed){
const vertex='#version 300 es\nin vec2 position;void main(){gl_Position=vec4(position,0,1);}';
const prefix='#version 300 es\nprecision highp float;precision highp int;precision highp sampler2D;uniform vec2 u_resolution;uniform float u_time,u_time_delta;uniform int u_frame,u_recursion,u_max_recursion;uniform sampler2D u_pass1,u_pass2;out vec4 fragColor;\n';
function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function program(fragment){const p=gl.createProgram(),vs=compile(gl.VERTEX_SHADER,vertex),fs=compile(gl.FRAGMENT_SHADER,fragment);gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));const names=['u_resolution','u_time','u_frame','u_pass1','u_pass2'];const uniforms={};for(const n of names)uniforms[n]=gl.getUniformLocation(p,n);return {p,uniforms,position:gl.getAttribLocation(p,'position')};}
function target(w,h,half,linear){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,half?gl.RGBA16F:gl.RGBA32F,w,h,0,gl.RGBA,half?gl.HALF_FLOAT:gl.FLOAT,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,linear?gl.LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,linear?gl.LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('A floating-point framebuffer could not be created.');gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return {t,f,w,h};}
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const END=4.775;
let programs={},states=[],lit=null,front=0,simFrame=0,simTime=0,accumulator=0,paused=false;
function draw(p,out,w,h,frame){gl.useProgram(p.p);gl.bindFramebuffer(gl.FRAMEBUFFER,out);gl.viewport(0,0,w,h);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(p.position);gl.vertexAttribPointer(p.position,2,gl.FLOAT,false,0,0);gl.uniform2f(p.uniforms.u_resolution,w,h);gl.uniform1i(p.uniforms.u_frame,frame);gl.uniform1f(p.uniforms.u_time,simTime);gl.uniform1i(p.uniforms.u_pass1,0);gl.uniform1i(p.uniforms.u_pass2,1);gl.drawArrays(gl.TRIANGLES,0,3);}
function simPass(frame){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,states[front].t);const next=1-front;draw(programs.simulation,states[next].f,states[next].w,states[next].h,frame);front=next;}
function reset(){
 for(const t of states){gl.deleteTexture(t.t);gl.deleteFramebuffer(t.f);}if(lit){gl.deleteTexture(lit.t);gl.deleteFramebuffer(lit.f);}for(const p of Object.values(programs))gl.deleteProgram(p.p);
 const nx=48,ny=56,nz=48,tw=nx*8,th=ny*(nz/8);
 let common=sources.common.replace('ivec3(48,56,48)',`ivec3(${nx},${ny},${nz})`).replace('ivec2(384,336)',`ivec2(${tw},${th})`);
 programs={};for(const name of ['simulation','shading','main'])programs[name]=program(prefix+common+'\n'+sources[name]);
 states=[target(tw*2+1,th*2,false,false),target(tw*2+1,th*2,false,false)];lit=target(tw,th,true,true);front=0;simFrame=0;simTime=0;accumulator=0;
 simPass(0);simFrame=1;
}
function display(){const dpr=Math.min(devicePixelRatio||1,1.5),w=Math.max(2,Math.round(innerWidth*dpr)),h=Math.max(2,Math.round(innerHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,states[front].t);draw(programs.shading,lit.f,lit.w,lit.h,simFrame);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lit.t);draw(programs.main,null,w,h,simFrame);}
let last=performance.now();
function frame(now){if(failed)return;try{const delta=Math.min((now-last)/1000,.1);last=now;if(!paused){accumulator=Math.min(accumulator+delta*.6,.1);let steps=0;while(accumulator>=.0025&&steps<20&&simTime<END-1e-8){simPass(simFrame);simPass(simFrame);simFrame++;simTime+=.0025;accumulator-=.0025;steps++;}if(simTime>=END-1e-8){paused=true;document.getElementById('pause').textContent='Replay';}}display();requestAnimationFrame(frame);}catch(e){fail(e);}}
document.getElementById('pause').onclick=()=>{try{if(simTime>=END-1e-8){reset();paused=false;}else paused=!paused;document.getElementById('pause').textContent=paused?'Play':'Pause';}catch(e){fail(e);}};
document.getElementById('restart').onclick=()=>{try{reset();paused=false;document.getElementById('pause').textContent='Pause';}catch(e){fail(e);}};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('pause').click();}if(e.key.toLowerCase()==='r')document.getElementById('restart').click();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();fail(new Error('Graphics context lost. Reload this file to restart the simulation.'));});
try{reset();requestAnimationFrame(frame);}catch(e){fail(e);}
}
</script></html>
